name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gnome:
    name: GNOME ${{ matrix.gnome }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        gnome: ['47', '48', '49', '50', '51']
    steps:
      - uses: actions/checkout@v4
      # Unit tests, schema and translation checks, then the headless GNOME
      # Shell suite, inside the release's container (tests/matrix/Dockerfile,
      # Dockerfile.fedora for GNOME 47).
      - name: Test against GNOME ${{ matrix.gnome }}
        run: bash scripts/test-matrix.sh ${{ matrix.gnome }}
      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-${{ matrix.gnome }}
          path: tests/output/matrix/gnome-${{ matrix.gnome }}
          if-no-files-found: ignore
