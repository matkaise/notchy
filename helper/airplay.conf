# A minimal PipeWire client that discovers AirPlay (RAOP) receivers on the
# local network via mDNS and offers each one as an ordinary audio output.
# Notchy runs it as `pipewire -c airplay.conf` while AirPlay is enabled; the
# outputs disappear with the process. Nothing in the system configuration is
# changed and the PipeWire daemon is never restarted.
context.properties = {
    log.level = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-raop-discover args = { } }
]
